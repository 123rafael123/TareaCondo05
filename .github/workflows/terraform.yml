name: Terraform OCI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-terraform
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Initialize providers without remote state
        run: terraform init -backend=false -input=false
      - name: Format Terraform configuration
        run: terraform fmt -recursive
      - name: Validate configuration
        run: terraform validate

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci_api_key.pem
      OCI_AUTH: "APIKey"
      OCI_REGION: ${{ vars.OCI_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Prepare OCI API key
        run: |
          printf '%s' "$OCI_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/oci_api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"
      - name: Configure OCI CLI and download remote state
        env:
          OCI_NAMESPACE: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          OCI_STATE_BUCKET: ${{ vars.OCI_TFSTATE_BUCKET }}
        run: |
          python3 -m pip install --user oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          cat > "$RUNNER_TEMP/oci_config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$OCI_PRIVATE_KEY_PATH
          EOF
          chmod 600 "$RUNNER_TEMP/oci_config"
          if ! oci --config-file "$RUNNER_TEMP/oci_config" --auth api_key os object get \
            --namespace "$OCI_NAMESPACE" \
            --bucket-name "$OCI_STATE_BUCKET" \
            --name "TareaCondo05/terraform.tfstate" \
            --file terraform.tfstate 2> "$RUNNER_TEMP/state-download-error.log"; then
            if grep -q '404' "$RUNNER_TEMP/state-download-error.log"; then
              echo "No existe el estado remoto todavía; inicio desde cero."
              rm -f terraform.tfstate
            else
              cat "$RUNNER_TEMP/state-download-error.log"
              exit 1
            fi
          fi
      - name: Initialize Terraform
        run: terraform init -input=false
      - name: Create execution plan
        run: terraform plan -input=false -out=tfplan
      - name: Apply execution plan
        run: terraform apply -input=false -auto-approve tfplan
      - name: Upload Terraform state to OCI Object Storage
        if: always()
        env:
          OCI_NAMESPACE: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
          OCI_STATE_BUCKET: ${{ vars.OCI_TFSTATE_BUCKET }}
        run: |
          if [ ! -f terraform.tfstate ]; then
            echo "No hay estado local para sincronizar."
            exit 0
          fi
          oci --config-file "$RUNNER_TEMP/oci_config" --auth api_key os object put \
            --namespace "$OCI_NAMESPACE" \
            --bucket-name "$OCI_STATE_BUCKET" \
            --name "TareaCondo05/terraform.tfstate" \
            --file terraform.tfstate \
            --force
